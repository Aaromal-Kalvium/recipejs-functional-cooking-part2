<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RecipeJS - Your Functional Cooking Companion</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header section -->
    <header>
      <h1>🍳 RecipeJS</h1>
      <p>Your Functional Cooking Companion</p>
    </header>

    <!-- Main section -->
    <main>
      <!-- Filter and Sort Controls -->
      <div id="controls-section">
        <!-- Filter Buttons -->
        <div class="controls-group">
          <h3>Filter by Difficulty:</h3>
          <div class="button-group">
            <button class="filter-btn active" data-filter="all">
              Show All Recipes
            </button>
            <button class="filter-btn" data-filter="easy">Easy</button>
            <button class="filter-btn" data-filter="medium">Medium</button>
            <button class="filter-btn" data-filter="hard">Hard</button>
            <button class="filter-btn" data-filter="quick">
              Quick (< 30 min)
            </button>
          </div>
        </div>

        <!-- Sort Buttons -->
        <div class="controls-group">
          <h3>Sort by:</h3>
          <div class="button-group">
            <button class="sort-btn" data-sort="none">Default Order</button>
            <button class="sort-btn" data-sort="name">Name (A-Z)</button>
            <button class="sort-btn" data-sort="time">
              Time (Fastest First)
            </button>
          </div>
        </div>
      </div>

      <!-- Recipe Container -->
      <div id="recipe-container">
        <!-- Recipe cards will be rendered here by JavaScript -->
      </div>
    </main>

    <!-- JavaScript file -->
    <script src="app.js"></script>
  </body>
</html>
